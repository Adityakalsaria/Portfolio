<svg xmlns="http://www.w3.org/2000/svg" width="512" height="2048" viewBox="0 0 512 2048" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="62%"  stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="82%"  stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Displacing the ramp gives the leading edge a cloudy front instead of
         a ruler-straight line. -->
    <filter id="clouds" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.0018"
                    numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="140"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="512" height="2048" fill="url(#g)" filter="url(#clouds)"/>
</svg>
